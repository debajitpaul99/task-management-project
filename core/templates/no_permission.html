<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Access Denied</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="min-h-screen flex items-center justify-center bg-emerald-50 px-4">

    <div class="w-full max-w-md bg-white p-8 rounded-2xl shadow-md text-center">

        <!-- Icon -->
        <div class="mx-auto mb-5 flex h-14 w-14 items-center justify-center rounded-full bg-red-50">
            <svg class="h-7 w-7 text-red-500"
                 fill="none"
                 stroke="currentColor"
                 viewBox="0 0 24 24">
                <path stroke-linecap="round"
                      stroke-linejoin="round"
                      stroke-width="2"
                      d="M12 9v3m0 4h.01M5.07 19h13.86c1.54 0 2.5-1.67 1.73-3L13.73 4c-.77-1.33-2.69-1.33-3.46 0L3.34 16c-.77 1.33.19 3 1.73 3z"/>
            </svg>
        </div>

        <!-- Heading -->
        <h1 class="text-2xl font-semibold text-gray-800 mb-3">
            Access Denied
        </h1>

        <!-- Description -->
        <p class="text-gray-500 text-sm leading-6">
            You do not have permission to access this page.
        </p>

        <!-- Home Button -->
        <a href="{% url 'dashboard' %}"
           class="mt-6 inline-flex items-center justify-center gap-2 rounded-lg
                  bg-emerald-600 px-5 py-2.5 text-sm font-semibold text-white
                  transition hover:bg-emerald-700">

            <!-- Back Arrow -->
            <svg class="h-4 w-4"
                 fill="none"
                 stroke="currentColor"
                 viewBox="0 0 24 24">
                <path stroke-linecap="round"
                      stroke-linejoin="round"
                      stroke-width="2"
                      d="M15 19l-7-7 7-7"/>
            </svg>

            Back to Dashboard
        </a>

    </div>

</body>
</html>
