{% extends "base.html" %}
{% block content %}

<div class="min-h-screen flex items-center justify-center bg-emerald-50 px-4 py-10">

  <div class="w-full max-w-2xl rounded-2xl border border-emerald-100 bg-white p-6 shadow-[0_20px_50px_rgba(16,185,129,0.08)] sm:p-8">

    <!-- Heading -->
    <div class="mb-7 text-center">
      <h1 class="text-2xl font-extrabold tracking-tight text-gray-900 sm:text-3xl">
        Welcome to MyManager
      </h1>

      <p class="mt-2 text-sm text-gray-500 sm:text-base">
        Sign in to continue to your account
      </p>
    </div>


    <!-- Sign In Form -->
    <form method="POST" class="space-y-5">
      {% csrf_token %}

      <!-- Username -->
      <div>
        <label
          for="username"
          class="mb-2 block text-sm font-semibold text-gray-700"
        >
          Username
        </label>

        <input
          id="username"
          type="text"
          name="username"
          placeholder="Enter your username"
          autocomplete="username"
          required
          class="w-full rounded-xl border border-gray-200 bg-gray-50/70 px-4 py-3 text-gray-800 outline-none transition placeholder:text-gray-400 focus:border-emerald-500 focus:bg-white focus:ring-4 focus:ring-emerald-100"
        >
      </div>


      <!-- Password -->
      <div>
        <div class="mb-2 flex items-center justify-between">

          <label
            for="password"
            class="text-sm font-semibold text-gray-700"
          >
            Password
          </label>

          <a
            href="{% url 'password-reset' %}"
            class="text-xs font-semibold text-emerald-600 transition hover:text-emerald-700"
          >
            Forgot password?
          </a>

        </div>

        <input
          id="password"
          type="password"
          name="password"
          placeholder="Enter your password"
          autocomplete="current-password"
          required
          class="w-full rounded-xl border border-gray-200 bg-gray-50/70 px-4 py-3 text-gray-800 outline-none transition placeholder:text-gray-400 focus:border-emerald-500 focus:bg-white focus:ring-4 focus:ring-emerald-100"
        >
      </div>


      <!-- Sign In Button -->
      <button
        type="submit"
        class="w-full rounded-xl bg-emerald-600 px-5 py-3 font-semibold text-white shadow-sm transition hover:bg-emerald-700 focus:outline-none focus:ring-4 focus:ring-emerald-100"
      >
        Sign In
      </button>

    </form>


    <!-- Divider -->
    <div class="my-7 flex items-center gap-4">
      <div class="h-px flex-1 bg-gray-200"></div>

      <span class="text-xs font-medium text-gray-400">
        New to MyManager?
      </span>

      <div class="h-px flex-1 bg-gray-200"></div>
    </div>


    <!-- Sign Up -->
    <a
      href="{% url 'sign-up' %}"
      class="flex w-full items-center justify-center rounded-xl border border-emerald-200 bg-white px-5 py-3 text-sm font-semibold text-emerald-700 transition hover:bg-emerald-50"
    >
      Create an account
    </a>

  </div>

</div>

{% endblock content %}
